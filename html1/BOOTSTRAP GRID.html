<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title> Exemplo de Grid com Bootstrap </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style type="text/css">
        div {
            background: rgb(255, 136, 0);
            font-weight: bold;
            padding: 5px;
            color: rgb(0, 0, 0);
            
            
        }
      .border{
        border: 1px solid rgb(255, 0, 0);
      }
        
      .container{
        background: rgb(255, 255, 255);
      }

      .container-fluid{
        background: rgb(255, 136, 0);
        margin-top: 50px;
        
      }

        
    </style>


</head>

<body>

    <div class="container text-center">
        <div class="row">
            <div class="col border">
            linha1 - coluna 1
        </div>
        
            <div class="col border">
            linha1 - coluna 2
        </div>
        <div class="row">
            <div class="col border">
            linha2 - coluna 1
        </div>
        
            <div class="col border">
            linha2 - coluna 2
        </div>
        
            <div class="col border">
            linha3 - coluna 1
        </div>
        
            <div class="col border">
            linha3 - coluna 2
        </div>
        </div>
    </div>
        

    <div class="container-fluid">
        <div class="row">
            <div class="col-4 border">
            linha1 - coluna 1
        </div>
        
            <div class="col-8 border">
            linha1 - coluna 2
        </div>
        <div class="row">
            <div class="col-6 border">
            linha2 - coluna 1
        </div>
        
            <div class="col-3 border">
            linha2 - coluna 2
        </div>
        
            <div class="col-3 border">
            linha2 - coluna 3
        </div>
        </div>
    </div>
    </div>
</div>
    </body>

    
</html>

<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title> Exemplo de HTML e CSS </title>
    <style>
       #container {
           width: 80%;
           margin: auto;
           font-family: Arial, sans-serif;
           background-color: #535353;
           padding: 20px;
           border-radius: 8px;
       }
       .texto-destaque {
           color: #000000;
           font-weight: bold;
       }
       ul li {
           list-style: none ;
           margin-bottom: 10px;
           display: inline;
       }
    </style>
</head>
<body>
    <div id="container">
        <h1> Meu Primeiro Exemplo de HTML e CSS </h1>
        <p class="texto-destaque"> Este é um parágrafo de exemplo para demonstrar a estrutura básica de um documento HTML com CSS embutido. </p>
        <ul>
            <li> Item 1 </li>
            <li> Item 2 </li>
            <li> Item 3 </li>
            <li> Item 4 </li>
            <li> Item 5 </li>
    </div>



</body>
    
</html>

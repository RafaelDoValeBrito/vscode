<form>
    <label> VALOR A </label> <input type="number" id="V1"> <br>
    <label> VALOR B </label> <input type="number" id="V2"> <br>
    <label> OPERAÇÃO </label>
    
        <select id="operacao">
        <option value="+"> Adição </option>
        <option value="-"> Subtração </option>
        <option value="*"> Multiplicação </option>
        <option value="/"> Divisão </option>       
        <option value="**"> Potência </option>     
    </select> <br>
    <a href="#" onclick="executar()"> executar </a> <br>
</form>
<div id="resultado"> Resultado </div>

<script src="json/json1calculadora.js" ></script>
<script>
    const executar = () => {
        const a = eval(document.getElementById("V1").value);
        const b = eval(document.getElementById("V2").value);
        let operacao = eval(document.getElementById("operacao").selectedIndex);
        let resultado = (operacao == 0) ? somar (a, b) : (operacao == 1) ? subtrair(a, b) : (operacao == 2) ? multiplicar(a, b) : (operacao == 3) ? dividir(a, b) : potencia(a, b);
        document.getElementById("resultado").innerHTML = ` O resultado da operação é:  ${resultado} `;
        
        }

      
        
    

</script>
